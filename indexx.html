<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HAHAHA BOBO KA</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            color: lime;
            font-family: 'Arial Black', sans-serif;
        }
        h1 {
            font-size: 5em;
            animation: glow 1s infinite alternate, move 1s infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px lime, 0 0 20px lime; }
            to { text-shadow: 0 0 30px lime, 0 0 60px lime, 0 0 90px lime; }
        }
        @keyframes move {
            0% { transform: translateX(0px); }
            50% { transform: translateX(20px); }
            100% { transform: translateX(0px); }
        }
    </style>
</head>
<body>
    <h1>HAHAHA BOBO KA</h1>
</body>
</html>
